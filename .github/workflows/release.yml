name: Release

# Per the app-release-conventions: verify → package → attach to a DRAFT release.
# Nothing is published automatically; a draft is created for the pushed tag,
# inspected, then published by hand (gh release edit --draft=false).
#
# Two triggers:
#   - push a tag `v*`     -> verify, package once, attach the VSIX + its SHA-256
#                            to a single draft release for that tag. Not flagged a
#                            pre-release; see the `prerelease:` note below for why.
#   - manual dispatch     -> verify and package only, no release. The VSIX is left
#                            as a workflow artifact so a smoke check has something
#                            inspectable without creating anything public.
#
# MARKETPLACE PUBLICATION IS DELIBERATELY ABSENT FROM THIS FILE. Pushing a tag must
# never be able to make an irreversible external release. Publication runs from its
# own manually dispatched workflow, which downloads the already-inspected VSIX from
# the draft release and verifies its digest before uploading. Do not add a publish
# step here, and do not grant this workflow `id-token: write`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: a failing suite means nothing gets packaged. Split from packaging so a
  # verification failure is unambiguous — it cannot be confused with a packaging
  # fault, and no artifact exists to be mistaken for a releasable one.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck and unit tests)
        run: npm run check

      - name: Coverage
        run: npm run test:coverage

      # The Extension Host tests need a display; xvfb provides one on the runner.
      # This covers both workspace shapes — one folder holding many repositories,
      # and a multi-root workspace of repositories from unrelated directories.
      - name: Extension Host integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Extension Host integration tests (latest stable, Linux)
        if: runner.os == 'Linux'
        env:
          REPOFOCUS_INTEGRATION_VSCODE_VERSION: stable
        run: xvfb-run -a npm run test:integration

      - name: Extension Host integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  package:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      # Packaged exactly once, and the artifact attached below is this same file —
      # never a rebuild, since two `vsce package` runs are not byte-identical and a
      # digest would then describe an artifact nobody inspected.
      #
      # `vsce package` runs `vscode:prepublish` (npm run check && npm run build), so
      # the checks run again here. That repetition is deliberate: it is the gate ON
      # THE SHIPPING PATH, the one that would still fire if this workflow were
      # bypassed and someone packaged by hand.
      - name: Package VSIX
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          file="repofocus-${version}.vsix"
          npm exec vsce package -- --out "$file"
          sha256sum "$file" > "${file}.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "digest=${file}.sha256" >> "$GITHUB_OUTPUT"
          cat "${file}.sha256"

      # Keeps a dispatch run inspectable without creating anything public.
      - name: Upload VSIX as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.digest }}
          if-no-files-found: error

      # The one release action used fleet-wide, pinned to a full commit SHA.
      # Tag pushes only — a dispatch run stops at the artifact above.
      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # NOT a pre-release. "Pre-release" versus "release" is a subjective label
          # that buys no real latitude — it reads as an excuse rather than a fact —
          # so a 0.x version number carries that signal on its own. The draft flag
          # above is what actually protects the release: nothing goes public until
          # it is inspected and published by hand.
          prerelease: false
          fail_on_unmatched_files: true
          name: RepoFocus ${{ github.ref_name }}
          # Body renders from the pushed tag, so the note never goes stale on a
          # version bump — no release-specific text is baked in.
          body: |
            **RepoFocus ${{ github.ref_name }}**

            A VS Code extension that keeps your Source Control view to the
            repositories that actually need you.

            **Install from this release**: download the `.vsix`, then run
            `code --install-extension repofocus-<version>.vsix` — or use
            **Extensions → … → Install from VSIX…**.

            The `.sha256` file alongside is the digest of the exact VSIX attached here.
          files: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.digest }}
