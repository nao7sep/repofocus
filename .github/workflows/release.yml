name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm run test:coverage
          xvfb-run -a npm run test:integration

      - name: Package VSIX
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          file="repofocus-${version}.vsix"
          npm exec vsce package -- --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_FILE: ${{ steps.package.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$VSIX_FILE" \
            --draft \
            --prerelease \
            --generate-notes \
            --title "RepoFocus $GITHUB_REF_NAME"
