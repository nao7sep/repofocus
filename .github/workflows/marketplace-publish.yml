name: Marketplace publish

# Publishes an already-built, already-inspected VSIX to the VS Code Marketplace.
#
# MANUAL DISPATCH ONLY, BY DESIGN. Pushing a tag must never be able to make an
# irreversible external release: `release.yml` builds and attaches a DRAFT GitHub
# release and stops there, and this workflow is the separate, deliberate act that
# publishes. Do not merge the two, and do not add a tag trigger here.
#
# It also never builds. It downloads the exact asset that `release.yml` produced
# and that a human then inspected, and verifies the SHA-256 before uploading —
# because two `vsce package` runs are not byte-identical, so anything rebuilt here
# would be an artifact nobody looked at.
#
# AUTHENTICATION is Microsoft Entra workload identity federation — no PAT, no
# stored secret. GitHub mints a short-lived OIDC token, Azure exchanges it for an
# access token for the user-assigned managed identity `repofocus-publisher`, and
# that identity is a Contributor on Marketplace publisher `nao7sep`.
# (Global Azure DevOps PATs retire 2026-12-01; this path does not depend on them.)
#
# `environment: marketplace` is LOAD-BEARING: the federated credential's subject is
# scoped to that environment, so without this line the OIDC subject will not match
# and the login fails with AADSTS700213.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0). Must be an existing draft release."
        required: true
        type: string

permissions:
  id-token: write # mint the OIDC token for the federated credential
  # `write`, not `read`, and the reason is not obvious: a DRAFT release is invisible
  # to a read-only token. Drafts are not addressable by tag at all — the REST
  # endpoint /releases/tags/{tag} 404s for them even for a repo owner — so `gh`
  # falls back to LISTING releases and matching client-side, and listing drafts
  # requires push access. With `contents: read` this step fails "release not found".
  # This workflow still creates and edits nothing; the digest check below is what
  # actually protects the publish.
  contents: write # list and download the draft release's assets

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be an exact vMAJOR.MINOR.PATCH value" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify exact tag checkout
        shell: bash
        run: |
          checked_out_tag="$(git tag --points-at HEAD --list "$RELEASE_TAG")"
          if [[ "$checked_out_tag" != "$RELEASE_TAG" ]]; then
            echo "checkout is not the requested exact tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # vsce comes from the repo's own pinned dependency rather than a floating
      # `npx @vscode/vsce`, so the tool that publishes is the one that was tested.
      - name: Install npm 12
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: npm run check:release-tag

      - name: Download the VSIX and its digest from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "$RELEASE_TAG must identify a draft release" >&2
            exit 1
          fi
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.vsix' --pattern '*.vsix.sha256'
          ls -la ./*.vsix ./*.vsix.sha256

      # The digest is the whole point of not rebuilding: it proves this is the
      # artifact that was inspected. A mismatch stops the run before anything
      # reaches the Marketplace, where a publish cannot be taken back.
      - name: Verify the digest
        run: |
          sha256sum --check ./*.vsix.sha256
          echo "digest verified against the attached artifact"

      - name: Sign in to Azure as the publishing identity
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity holds no subscription role — it only needs a token for
          # Azure DevOps — so a subscription-less login is expected, not a fault.
          allow-no-subscriptions: true

      - name: Publish to the Marketplace
        run: |
          vsix="$(ls ./*.vsix)"
          echo "publishing $vsix"
          # --packagePath: upload this exact file, never repackage.
          # --skip-duplicate: re-running for a version already published is a no-op
          #   rather than a hard failure, so a partial run is safe to repeat.
          # --azure-credential: use the federated identity above, not a PAT.
          #
          # NOT --pre-release, deliberately. A Marketplace pre-release is normally
          # opt-in: VS Code installs the latest STABLE by default and a user has to
          # choose "Switch to Pre-Release Version". With no stable version to fall
          # back to, that risks an extension people can find but not straightforwardly
          # install — which defeats the point of listing it. 0.x is signalled by the
          # version number and the changelog instead.
          npm exec vsce -- publish \
            --packagePath "$vsix" \
            --skip-duplicate \
            --azure-credential

      - name: Summary
        run: |
          {
            echo "## Published"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Listing: https://marketplace.visualstudio.com/items?itemName=nao7sep.repofocus"
            echo
            echo "The GitHub release is still a **draft** — publishing it there is a separate, manual step."
          } >> "$GITHUB_STEP_SUMMARY"
